[opener]
edit = [
  { run = '$EDITOR "%s"', block = true},
]
open = [
  { run = 'open "%s"', desc = "Open", orphan = true, for = 'macos' },
  { run = 'xdg-open "%s"', desc = "Open", orphan = true, for = 'linux' },
]

[open]
prepend_rules = [
	{ url = "*.html", use = "open" },

	{ mime = "image/*", use = [ "open" ] },
]
